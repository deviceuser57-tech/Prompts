<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قاموس البصر — Visual Codewords Studio</title>
    <meta name="description" content="مساعد الأوامر البصرية: مراجعة طلبك، ترشيح أنسب نموذج توليد، وتركيب برومبت احترافي شامل من مكتبة 250+ أمر Slash." />
    <script>
      (function () {
        try {
          var th = localStorage.getItem("basar.theme") || "dark";
          var lo = localStorage.getItem("basar.locale") || "ar";
          document.documentElement.dataset.theme = th;
          document.documentElement.lang = lo;
          document.documentElement.dir = lo === "en" ? "ltr" : "rtl";
          document.title = lo === "en" ? "Basar Codewords — Visual Prompt Studio" : "قاموس البصر — Visual Codewords Studio";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1220; }
      html[data-theme="light"], html[data-theme="light"] body { background: #e7edf6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
